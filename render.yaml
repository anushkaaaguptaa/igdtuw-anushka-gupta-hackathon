services:
  - type: web
    name: risklens-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: RISKLENS_NLP_INFERENCE_MODE
        value: mock
      - key: DEFAULT_VAR_SIMULATION_DRAWS
        value: 1000
